name: Verify BV-Garden
on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - scripts/build.mjs
      - package.json
      - scripts/verify-site.mjs
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - index.html
      - src/**
      - scripts/build.mjs
      - package.json
      - scripts/verify-site.mjs
      - .github/workflows/verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deterministic source build
        run: node scripts/build.mjs --check
      - name: Verify standalone game
        run: node scripts/verify-site.mjs
